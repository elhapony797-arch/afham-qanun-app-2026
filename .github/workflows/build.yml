name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      PYTHONUNBUFFERED: "1"
      PIP_NO_CACHE_DIR: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git zip unzip curl wget ant \
            build-essential \
            autoconf automake libtool \
            libltdl-dev \
            pkg-config \
            cmake \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            libffi-dev \
            libssl-dev \
            libsqlite3-dev \
            libbz2-dev \
            libreadline-dev \
            autopoint gettext \
            python3-pip

      - name: Verify Java and Ant
        run: |
          java -version
          javac -version
          ant -version

          echo "ANT executable:"
          command -v ant

          echo "ANT directory:"
          ls -la /usr/bin/ant

          test -x /usr/bin/ant

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            buildozer==1.5.0 \
            cython==0.29.36

          buildozer --version
          cython --version

      - name: Install Cython for system Python
        run: |
          sudo /usr/bin/python3 -m pip install "cython==0.29.36" setuptools wheel
          /usr/bin/python3 -c "import Cython; print('System Cython', Cython.__version__)"

      - name: Configure Buildozer
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("buildozer.spec")

          if not path.exists():
              raise SystemExit("ERROR: buildozer.spec not found")

          lines = path.read_text(encoding="utf-8").splitlines()

          lines = [
              line for line in lines
              if not line.strip().startswith("android.ant_path")
          ]

          app_index = next(
              (i for i, line in enumerate(lines)
               if line.strip() == "[app]"),
              None
          )

          if app_index is None:
              raise SystemExit("ERROR: [app] section not found")

          lines.insert(
              app_index + 1,
              "android.ant_path = /usr"
          )

          path.write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8"
          )

          print("Apache Ant configured at /usr")
          PY

          grep "^android.ant_path" buildozer.spec

      - name: Clean previous build
        run: |
          rm -rf .buildozer
          rm -rf "$HOME/.buildozer"
          rm -rf bin

          mkdir -p bin

      - name: Download Arabic font
        run: |
          rm -f font.ttf

          for url in \
            "https://github.com/google/fonts/raw/main/ofl/amiri/Amiri-Regular.ttf" \
            "https://github.com/google/fonts/raw/main/ofl/tajawal/Tajawal-Regular.ttf"
          do
            if curl --retry 3 --retry-delay 2 \
              -fL "$url" -o font.ttf; then

              if [ -s font.ttf ] && \
                [ "$(stat -c%s font.ttf)" -gt 50000 ]; then
                break
              fi
            fi

            rm -f font.ttf
          done

          if [ ! -s font.ttf ]; then
            echo "ERROR: Arabic font download failed"
            exit 1
          fi

          ls -lh font.ttf

      - name: Verify configuration
        run: |
          set -e

          buildozer --version
          ant -version

          grep -q "^android.ant_path = /usr$" buildozer.spec
          grep -q "^android.api = 33$" buildozer.spec
          grep -q "^android.minapi = 24$" buildozer.spec
          grep -q "^android.ndk = 25b$" buildozer.spec
          grep -q "^android.archs = armeabi-v7a$" buildozer.spec
          grep -q "^p4a.branch = v2024.01.21$" buildozer.spec

          test -x /usr/bin/ant
          test -s font.ttf

          echo "All configuration checks passed"

      - name: Build Android APK
        run: |
          set -o pipefail

          buildozer -v android debug 2>&1 | tee build.log

      - name: Verify APK
        if: success()
        run: |
          set -e

          echo "Checking generated APK..."

          ls -lh bin/*.apk

          test -n "$(find bin -maxdepth 1 -name '*.apk' -print -quit)"

          echo "APK generated successfully"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: afham-qanun-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: afham-qanun-build-logs
          path: |
            build.log
            .buildozer/logs/**
          if-no-files-found: ignore
          retention-days: 7
