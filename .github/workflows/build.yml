name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      PYTHONUNBUFFERED: "1"
      PIP_NO_CACHE_DIR: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            build-essential \
            autoconf automake libtool \
            libltdl-dev \
            pkg-config \
            cmake \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            libffi-dev \
            libssl-dev \
            libsqlite3-dev \
            libbz2-dev \
            libreadline-dev \
            autopoint gettext

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer==1.5.0 cython==0.29.36

      - name: Clean previous build
        run: |
          rm -rf .buildozer
          rm -rf ~/.buildozer
          rm -rf bin

      - name: Download Arabic font
        run: |
          rm -f font.ttf
          for url in \
            "https://github.com/google/fonts/raw/main/ofl/amiri/Amiri-Regular.ttf" \
            "https://github.com/google/fonts/raw/main/ofl/tajawal/Tajawal-Regular.ttf"; do
            curl -fL -o font.ttf "$url" || true
            if [ -s font.ttf ] && [ "$(stat -c%s font.ttf)" -gt 50000 ]; then
              break
            fi
            rm -f font.ttf
          done
          ls -l font.ttf
          test -s font.ttf

      - name: Verify configuration
        run: |
          buildozer --version
          grep -q "^android.api = 33$" buildozer.spec
          grep -q "^android.minapi = 24$" buildozer.spec
          grep -q "^android.ndk = 25b$" buildozer.spec
          grep -q "^android.archs = armeabi-v7a$" buildozer.spec
          grep -q "^p4a.branch = v2024.01.21$" buildozer.spec
          echo "Configuration verified"

      - name: Build APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: afham-qanun-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: afham-qanun-build-logs
          path: |
            build.log
            .buildozer/logs/**
          if-no-files-found: ignore
