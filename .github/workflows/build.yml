
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      PYTHONUNBUFFERED: "1"
      P4A_RELEASE: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: ""

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            build-essential \
            autoconf automake libtool \
            libltdl-dev \
            pkg-config \
            cmake \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            libffi-dev \
            libssl-dev \
            libsqlite3-dev \
            libbz2-dev \
            libreadline-dev \
            autopoint gettext

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer cython==0.29.36

      - name: Clean previous build
        run: |
          rm -rf .buildozer
          rm -rf ~/.buildozer
          rm -rf bin

      - name: Verify configuration
        run: |
          echo "Checking Android configuration"
          grep -E "^(requirements|android.api|android.minapi|android.ndk_api|android.archs)" buildozer.spec

          grep -q "^android.minapi = 24$" buildozer.spec
          grep -q "^android.ndk_api = 24$" buildozer.spec

          echo "Checking Python"
          python --version

          echo "Checking Java"
          java -version

          echo "Checking Buildozer"
          buildozer --version

      - name: Build APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: afham-qanun-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: afham-qanun-build-log
          path: build.log
          if-no-files-found: ignore
